[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-starter"
version = "0.1.0"
description = "Offline-first scaffold for study-level knee MRI experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "pydicom>=3", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["knee*"]
